name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HELM_IMAGE: ghcr.io/appuio/helm-v4
      HELM_VERSION: 4.1.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check CRD pin
        run: python3 scripts/refresh-crd.py --check
      - name: Configure Helm registry
        run: |
          mkdir -p "$HOME/.config/helm/registry"
          echo '{}' > "$HOME/.config/helm/registry/config.json"
      - name: Lint chart
        run: scripts/helm-docker.sh lint .
      - name: Template CRDs
        run: scripts/helm-docker.sh template crds .
