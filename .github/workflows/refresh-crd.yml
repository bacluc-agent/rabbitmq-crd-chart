name: Refresh CRD

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      HELM_IMAGE: ghcr.io/appuio/helm-v4
      HELM_VERSION: 4.1.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh CRD
        run: python3 scripts/refresh-crd.py
      - name: Commit refreshed CRD
        if: github.event_name == 'pull_request'
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "CRD already matches the pinned operator version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/crd/rabbitmqclusters.rabbitmq.com.yaml
          pin="$(awk -F'"' '/rabbitmq-operator-version:/ {print $2; exit}' Chart.yaml)"
          git commit -m "chore(crd): sync CRD with rabbitmq cluster-operator ${pin#v}"
          git push origin "HEAD:${HEAD_REF}"
      - name: Configure Helm registry
        run: |
          mkdir -p "$HOME/.config/helm/registry"
          echo '{}' > "$HOME/.config/helm/registry/config.json"
      - name: Check CRD pin
        run: python3 scripts/refresh-crd.py --check
      - name: Lint chart
        run: scripts/helm-docker.sh lint .
      - name: Template CRDs
        run: scripts/helm-docker.sh template crds .
